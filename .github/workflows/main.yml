name: "Create Conan Package"
on: push

jobs:
  build_linux_armv6:
    name: "Linux"
    uses: Privatehive/conan-workflows/.github/workflows/createPackage.yml@master
    with:
      name: "x86_64 (target armv6)"
      image: "ubuntu-22.04"
      export_conan_cache: true
      export_conan_cache_key: "armv6"
      conan_remotes: https://conan.privatehive.de/artifactory/api/conan/public-conan
      conan_options: "raspberry-pi-toolchain/*:target_arch=armv6"

  # Imports the armv6 cache so that the exported cache contains the binaries of both target architectures
  build_linux_armv8:
    name: "Linux"
    uses: Privatehive/conan-workflows/.github/workflows/createPackage.yml@master
    needs: [ build_linux_armv6 ]
    if: ${{ success() }}
    with:
      name: "x86_64 (target armv8)"
      image: "ubuntu-22.04"
      import_conan_cache: true
      import_conan_cache_key: "armv6"
      export_conan_cache: true
      export_conan_cache_key: "all"
      conan_remotes: https://conan.privatehive.de/artifactory/api/conan/public-conan
      conan_options: "raspberry-pi-toolchain/*:target_arch=armv8"

  upload_recipe:
    name: "Finalize"
    uses: Privatehive/conan-workflows/.github/workflows/uploadRecipe.yml@master
    needs: [ build_linux_armv8 ]
    if: ${{ success() }}
    secrets: inherit
    with:
      import_conan_cache: true
      import_conan_cache_key: "all"
      upload_include_package: true
      publish_property: ${{ github.ref == 'refs/heads/master' }}
      conan_upload_remote: https://conan.privatehive.de/artifactory/api/conan/public-conan
